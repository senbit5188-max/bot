<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram 联系人注册查询</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .section { margin-bottom: 28px; padding: 20px; border: 1px solid #e8ecf1; border-radius: 10px; background: #fafbfc; }
        .section h2 { font-size: 18px; margin-bottom: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #555; }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d9e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0077b3; }
        button:disabled { background: #9fcbe0; cursor: not-allowed; }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #e8ecf1; text-align: left; }
        th { font-weight: 600; color: #555; }
        .online { color: #28a745; font-weight: 600; }
        .registered { color: #28a745; }
        .not-registered { color: #dc3545; }
        .hint { font-size: 12px; color: #888; margin-top: 6px; }
        .hidden { display: none; }
        .mode-toggle { margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Telegram 联系人注册查询</h1>
        <p class="subtitle">导入自有手机号，查询对应 Telegram 账号与在线状态</p>

        <div id="auth-section" class="section">
            <h2>登录 Telegram</h2>
            <div id="auth-status" class="status info hidden"></div>
            <div id="auth-start">
                <button id="send-code-btn" onclick="startAuth()">发送验证码</button>
                <p class="hint">验证码会发送到你部署时配置的手机号。</p>
            </div>
            <div id="auth-code" class="hidden">
                <div class="form-group">
                    <label for="code">验证码</label>
                    <input type="text" id="code" placeholder="12345">
                </div>
                <div class="form-group">
                    <label for="password">2FA 密码（如启用）</label>
                    <input type="password" id="password" placeholder="可选">
                </div>
                <button id="verify-btn" onclick="verifyCode()">验证并登录</button>
            </div>
        </div>

        <div id="import-section" class="section hidden">
            <h2>导入号码</h2>
            <div class="form-group">
                <label>输入方式</label>
                <select id="mode" onchange="toggleMode()">
                    <option value="csv">列表 / CSV</option>
                    <option value="range">号段</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prefix">国家码前缀（可选）</label>
                <input type="text" id="prefix" placeholder="例如 +86 或 +852" value="+86">
            </div>
            <div id="csv-group">
                <div class="form-group">
                    <label for="phones">号码列表</label>
                    <textarea id="phones" placeholder="每行一个号码，或逗号分隔&#10;+8613900000001&#10;+8613900000002"></textarea>
                    <p class="hint">支持 +86 或 00 开头，建议一次不超过 1000 个。</p>
                </div>
            </div>
            <div id="range-group" class="hidden">
                <div class="form-group">
                    <label for="range">号段</label>
                    <input type="text" id="range" placeholder="13900000001-13900000999">
                    <p class="hint">最多 1000 个号码，会自动加上前缀。</p>
                </div>
            </div>
            <button id="import-btn" onclick="importContacts()">查询注册情况</button>

            <div id="results" class="hidden">
                <h3>查询结果</h3>
                <div id="summary"></div>
                <table>
                    <thead>
                        <tr>
                            <th>输入号码</th>
                            <th>注册状态</th>
                            <th>Telegram 名称</th>
                            <th>用户名</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function showAuth(message, type = 'info') {
            const el = document.getElementById('auth-status');
            el.textContent = message;
            el.className = `status ${type}`;
            el.classList.remove('hidden');
        }

        function setAuth(state) {
            if (state === 'authenticated') {
                document.getElementById('auth-start').classList.add('hidden');
                document.getElementById('auth-code').classList.add('hidden');
                document.getElementById('import-section').classList.remove('hidden');
                showAuth('已登录 Telegram', 'success');
            } else if (state === 'awaiting_code') {
                document.getElementById('auth-start').classList.add('hidden');
                document.getElementById('auth-code').classList.remove('hidden');
                showAuth('请输入验证码', 'info');
            } else {
                document.getElementById('auth-start').classList.remove('hidden');
                document.getElementById('auth-code').classList.add('hidden');
                document.getElementById('import-section').classList.add('hidden');
                showAuth('请先登录', 'info');
            }
        }

        async function checkAuth() {
            try {
                const res = await fetch('api/auth/status');
                const data = await res.json();
                setAuth(data.state);
            } catch (err) {
                showAuth('检查登录状态失败: ' + err.message, 'error');
            }
        }

        async function startAuth() {
            const btn = document.getElementById('send-code-btn');
            btn.disabled = true;
            try {
                const res = await fetch('api/auth/start', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '发送失败');
                showAuth('验证码已发送，请查看 Telegram', 'success');
                setAuth('awaiting_code');
            } catch (err) {
                showAuth('发送验证码失败: ' + err.message, 'error');
                btn.disabled = false;
            }
        }

        async function verifyCode() {
            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value.trim() || undefined;

            try {
                const res = await fetch('api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '验证失败');
                showAuth('登录成功', 'success');
                setAuth('authenticated');
            } catch (err) {
                showAuth('验证失败: ' + err.message, 'error');
                btn.disabled = false;
            }
        }

        function toggleMode() {
            const mode = document.getElementById('mode').value;
            if (mode === 'csv') {
                document.getElementById('csv-group').classList.remove('hidden');
                document.getElementById('range-group').classList.add('hidden');
            } else {
                document.getElementById('csv-group').classList.add('hidden');
                document.getElementById('range-group').classList.remove('hidden');
            }
        }

        async function importContacts() {
            const btn = document.getElementById('import-btn');
            btn.disabled = true;

            const mode = document.getElementById('mode').value;
            const prefix = document.getElementById('prefix').value.trim();
            const body = { prefix };

            if (mode === 'csv') {
                body.csv = document.getElementById('phones').value;
            } else {
                body.range = document.getElementById('range').value;
            }

            try {
                const res = await fetch('api/contacts/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '查询失败');
                renderResults(data.results);
            } catch (err) {
                alert('查询失败: ' + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function renderResults(results) {
            const section = document.getElementById('results');
            const tbody = document.getElementById('results-body');
            const summary = document.getElementById('summary');
            tbody.innerHTML = '';

            const registered = results.filter(r => r.registered).length;
            summary.innerHTML = `<p>共 ${results.length} 个号码，其中 <strong>${registered}</strong> 个已注册 Telegram。</p>`;

            for (const row of results) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(row.phone)}</td>
                    <td class="${row.registered ? 'registered' : 'not-registered'}">${row.registered ? '已注册' : '未注册'}</td>
                    <td>${escapeHtml(row.firstName || '')} ${escapeHtml(row.lastName || '')}</td>
                    <td>${row.username ? '@' + escapeHtml(row.username) : '-'}</td>
                    <td class="${row.online ? 'online' : ''}">${escapeHtml(row.status || '-')}</td>
                `;
                tbody.appendChild(tr);
            }

            section.classList.remove('hidden');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        checkAuth();
    </script>
</body>
</html>
